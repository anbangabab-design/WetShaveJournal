name: Release macOS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build macOS .dmg
        run: |
          cd macos
          WSJ_DATA_DIR="$GITHUB_WORKSPACE/out-macos" bash build.sh
          VER=$(grep '^VERSION=' build.sh | head -n1 | cut -d'"' -f2)
          test -f "$GITHUB_WORKSPACE/out-macos/WetShaveJournal-${VER}-arm64.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: out-macos/WetShaveJournal-*-arm64.dmg

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate SHA256SUMS.txt
        run: |
          find artifacts -mindepth 2 -type f -exec mv -t artifacts/ {} +
          find artifacts -mindepth 1 -type d -empty -delete
          rm -f artifacts/SHA256SUMS.txt
          (cd artifacts && sha256sum *.dmg > SHA256SUMS.txt)
      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: false
          body_path: RELEASE_NOTES.md
          files: artifacts/*
