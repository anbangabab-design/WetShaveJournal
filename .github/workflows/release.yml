name: Release macOS & Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build macOS .pkg
        run: |
          cd macos
          WSJ_DATA_DIR="$GITHUB_WORKSPACE/out-macos" WSJ_APP_DIR="/tmp/wsj-app" bash build.sh
          VER=$(grep '^VERSION=' build.sh | head -n1 | cut -d'"' -f2)
          if [ -f "$GITHUB_WORKSPACE/out-macos/湿剃日记-${VER}.pkg" ]; then
            cp "$GITHUB_WORKSPACE/out-macos/湿剃日记-${VER}.pkg" "$GITHUB_WORKSPACE/out-macos/WetShaveJournal-${VER}-arm64.pkg"
          fi
          test -f "$GITHUB_WORKSPACE/out-macos/WetShaveJournal-${VER}-arm64.pkg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: out-macos/WetShaveJournal-*-arm64.pkg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./windows/src-tauri -> target"
      - name: Build Windows installers
        working-directory: windows
        run: |
          npm install
          npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            windows/src-tauri/target/release/bundle/nsis/*.exe
            windows/src-tauri/target/release/bundle/msi/*.msi

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: false
          body_path: RELEASE_NOTES.md
          files: artifacts/*
